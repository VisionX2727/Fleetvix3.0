openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: legal
    description: Public legal documents and administrator-managed site content
  - name: storage
    description: Authenticated file uploads and object storage
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /public/legal:
    get:
      operationId: getPublicLegalContent
      tags: [legal]
      summary: Get public legal documents and contact information
      responses:
        "200":
          description: Current legal documents and public contact information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteContentResponse"
  /admin/site-content:
    get:
      operationId: getAdminSiteContent
      tags: [legal]
      summary: Get legal documents and contact information for editing
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Legal documents and contact information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteContentResponse"
    put:
      operationId: updateAdminSiteContent
      tags: [legal]
      summary: Update legal documents and contact information
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteContentInput"
      responses:
        "200":
          description: Updated legal documents and contact information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteContentResponse"
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a private object upload URL
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
                $ref: "#/components/schemas/UploadFileMetadata"
      responses:
        "200":
          description: Signed upload URL and private object path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResult"
        "400":
          description: Invalid file metadata
        "401":
          description: Authentication required
        "500":
          description: Could not create an upload URL
components:
  schemas:
    UploadFileMetadata:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 180
        size:
          type: number
          minimum: 1
          maximum: 10485760
        contentType:
          type: string
          minLength: 1
          maxLength: 120
    UploadUrlResult:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
        objectPath:
          type: string
          minLength: 1
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    SiteContent:
      type: object
      properties:
        termsContent:
          type: string
          maxLength: 60000
        privacyContent:
          type: string
          maxLength: 60000
        legalName:
          type: string
          maxLength: 200
        businessAddress:
          type: string
          maxLength: 1000
        supportEmail:
          type: string
          maxLength: 320
        privacyEmail:
          type: string
          maxLength: 320
        supportPhone:
          type: string
          maxLength: 80
        termsUpdatedAt:
          type: string
          format: date-time
        privacyUpdatedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - termsContent
        - privacyContent
        - legalName
        - businessAddress
        - supportEmail
        - privacyEmail
        - supportPhone
        - termsUpdatedAt
        - privacyUpdatedAt
        - updatedAt
    SiteContentInput:
      type: object
      properties:
        termsContent:
          type: string
          minLength: 1
          maxLength: 60000
        privacyContent:
          type: string
          minLength: 1
          maxLength: 60000
        legalName:
          type: string
          maxLength: 200
        businessAddress:
          type: string
          maxLength: 1000
        supportEmail:
          type: string
          maxLength: 320
        privacyEmail:
          type: string
          maxLength: 320
        supportPhone:
          type: string
          maxLength: 80
      required:
        - termsContent
        - privacyContent
        - legalName
        - businessAddress
        - supportEmail
        - privacyEmail
        - supportPhone
    SiteContentResponse:
      type: object
      properties:
        content:
          $ref: "#/components/schemas/SiteContent"
      required:
        - content
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer

